[workspace]
resolver = "2"
members = [
    "crates/gareji-contracts",
    "crates/gareji-codex-runner",
    "crates/gareji-core-cli",
    "crates/gareji-setup",
    "crates/agentmesh-proto",
    "crates/agentmesh-host",
    "crates/agentmesh-cli",
    "crates/agentmesh-app",
    "crates/gareji-core",
    "crates/agentmesh-conformance",
    "test-support/agentmesh-fixture-support",
    "plugins/fixtures/echo",
    "plugins/fixtures/bad-json",
    "plugins/fixtures/bad-schema",
    "plugins/fixtures/sleep",
    "plugins/fixtures/exit-nonzero",
    "plugins/fixtures/stderr-success",
]
default-members = [
    "crates/gareji-contracts",
    "crates/gareji-codex-runner",
    "crates/gareji-core-cli",
    "crates/gareji-setup",
    "crates/agentmesh-proto",
    "crates/agentmesh-host",
    "crates/agentmesh-cli",
    "crates/agentmesh-app",
    "crates/gareji-core",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Gareji-AI/gareji-core"
publish = false
rust-version = "1.85"

[workspace.dependencies]
gareji-contracts = { path = "crates/gareji-contracts" }
gareji-codex-runner = { path = "crates/gareji-codex-runner" }
gareji-core = { path = "crates/gareji-core" }
gareji-bootstrap = { path = "crates/gareji-setup" }
agentmesh-proto = { path = "crates/agentmesh-proto" }
agentmesh-host = { path = "crates/agentmesh-host" }
agentmesh-fixture-support = { path = "test-support/agentmesh-fixture-support" }
agentmesh-app = { path = "crates/agentmesh-app" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
toml = { version = "0.8", default-features = false, features = ["parse", "display"] }
tokio = { version = "1.45", features = ["rt-multi-thread", "macros", "process", "io-util", "time", "sync", "signal", "fs"] }
bytes = "1.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive", "env"] }
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
uuid = { version = "1.16", features = ["v4"] }
schemars = { version = "0.8", features = ["preserve_order"] }
tempfile = "3.20"
proptest = "1.6"
assert_cmd = "2.0"
predicates = "3.1"
which = "7.0"
rusqlite = { version = "0.40", features = ["bundled"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "allow"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "allow", priority = -1 }
nursery = { level = "allow", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
cognitive_complexity = "allow"
identity_op = "allow"
field_reassign_with_default = "allow"
needless_continue = "allow"
match_same_arms = "allow"
if_same_then_else = "allow"
map_unwrap_or = "allow"
never_loop = "allow"
useless_vec = "allow"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
